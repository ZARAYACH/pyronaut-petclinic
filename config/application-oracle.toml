[datasources.default]
url = '${auto.test.resources.datasources.default.url:jdbc:oracle:thin:@localhost:1521/FREEPDB1}'
username = '${auto.test.resources.datasources.default.username:petclinic}'
password = '${auto.test.resources.datasources.default.password:petclinic}'
db-type = 'oracle'
driver-class-name = 'oracle.jdbc.OracleDriver'
dialect = 'ORACLE'
maximum-pool-size = 10
minimum-idle = 2
initialization-fail-timeout = 60000
connection-timeout = 30000

[datasources.default.dialect-options]
version = '23.1'

[flyway.datasources.default]
locations = ['classpath:db/migration']
